[project]
name = "enterprise-text2sql"
version = "0.1.0"
description = "Enterprise Text-to-SQL API using RAG with FastAPI, ChromaDB, and Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "sqlalchemy>=1.4.0",
    "sqlparse>=0.4.4",
    "pandas>=1.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "datasets>=3.0.0",
]